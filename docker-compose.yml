services:
  postgres:
    image: postgres:17-alpine
    container_name: budget-control-db

    environment:
      POSTGRES_DB: budget_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5437:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d budget_control" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: